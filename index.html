<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanderkarte Münster – Termine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header>
  <h1>Wanderkarte</h1>
  <span class="sub">Monatliche Treffpunkte in Münster</span>
  <span class="count" id="count"></span>
</header>

<main>
  <aside id="list"></aside>
  <div id="map"></div>
</main>

<footer>
  <div class="tl-head">
    <span class="range-label" id="range-label"></span>
    <div class="legend">
      <span class="l-past"><i></i>vergangen</span>
      <span class="l-future"><i></i>geplant</span>
    </div>
  </div>
  <div class="timeline" id="timeline"></div>
</footer>

<!-- Termine liegen in termine.json und werden von script.js geladen.
     Zum Aktualisieren nur die JSON editieren.
     Einträge ohne lat/lng erscheinen nur in der Liste, nicht auf der Karte.
     Hinweis: lokal per HTTP-Server öffnen (z. B. `python3 -m http.server`),
     da fetch() bei file://-URLs blockiert wird. -->
<script src="script.js"></script>
</body>
</html>
